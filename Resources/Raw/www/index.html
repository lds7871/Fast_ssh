<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>SSH快连</title>
<link rel="stylesheet" href="xterm.css"/>
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0D1117; }
#terminal { width:100%; height:100%; }
</style>
</head>
<body>
<div id="terminal"></div>
<script src="xterm.js"></script>
<script src="fit.js"></script>
<script>
(function () {
    'use strict';

    var WS_URL = 'ws://127.0.0.1:22886';

    var term = new Terminal({
        cursorBlink: true,
        fontSize: 14,
        fontFamily: 'monospace, "Droid Sans Mono", "Noto Sans Mono CJK SC", sans-serif',
        scrollback: 5000,
        theme: {
            background: '#0D1117',
            foreground: '#E6EDF3',
            cursor: '#3FB950',
            selectionBackground: '#2A2F3A'
        }
    });

    var fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.open(document.getElementById('terminal'));
    fit.fit();
    term.focus();

    window.__term = term; // 暴露给 CDP/调试读取选区与状态

    var ws = null;
    var pending = [];       // 连接建立前的输入缓冲
    var reconnecting = false;

    function sendResize() {
        if (!ws || ws.readyState !== 1) return;
        var dims = fit.proposeDimensions();
        if (!dims) return;
        ws.send('\u0000resize:' + dims.cols + ':' + dims.rows);
    }

    function connect() {
        if (reconnecting) return;
        reconnecting = true;
        try {
            ws = new WebSocket(WS_URL);
        } catch (e) {
            reconnecting = false;
            setTimeout(connect, 800);
            return;
        }
        ws.onopen = function () {
            reconnecting = false;
            while (pending.length) ws.send(pending.shift());
            sendResize();
        };
        ws.onmessage = function (ev) {
            if (typeof ev.data === 'string') term.write(ev.data);
        };
        ws.onclose = function () {
            ws = null;
            setTimeout(connect, 800);
        };
        ws.onerror = function () {
            try { ws.close(); } catch (e) {}
        };
    }

    // 发送输入（带 Ctrl/Alt 组合键处理）
    var ctrlMode = false;
    var altMode = false;
    function sendInput(data) {
        if (ws && ws.readyState === 1) ws.send(data);
        else pending.push(data);
    }
    term.onData(function (data) {
        // Ctrl 模式：单个字母转成对应控制字符（如 c -> \x03 = Ctrl+C）
        if (ctrlMode && data.length === 1) {
            var code = data.charCodeAt(0);
            if (code >= 97 && code <= 122) { sendInput(String.fromCharCode(code - 96)); return; }
            if (code >= 65 && code <= 90) { sendInput(String.fromCharCode(code - 64)); return; }
        }
        // Alt 模式：单个字符前加 ESC 前缀（Meta 键）
        if (altMode && data.length === 1) {
            sendInput('\x1b' + data);
            return;
        }
        sendInput(data);
    });

    // 供 C# 顶栏功能键调用：ctrl/alt 切换模式，up/down/left/right 发送方向键转义序列
    window.__key = function (kind) {
        switch (kind) {
            case 'ctrl': ctrlMode = !ctrlMode; break;
            case 'alt': altMode = !altMode; break;
            case 'up': sendInput('\x1b[A'); break;
            case 'down': sendInput('\x1b[B'); break;
            case 'left': sendInput('\x1b[D'); break;
            case 'right': sendInput('\x1b[C'); break;
        }
    };

    // 尺寸变化（旋转 / 软键盘 / 工具栏）时重新适配并通知服务器
    var fitTimer = null;
    function doFit() {
        if (fitTimer) clearTimeout(fitTimer);
        fitTimer = setTimeout(function () {
            fit.fit();
            sendResize();
        }, 120);
    }
    window.addEventListener('resize', doFit);
    if (window.ResizeObserver) {
        new ResizeObserver(doFit).observe(document.getElementById('terminal'));
    }

    // 供 C# 在 WebView 复用（页面重载后重连）时调用
    window.__reconnect = function () {
        if (!ws || ws.readyState === 3) connect();
    };

    // 供 C#「复制」按钮使用：返回终端当前缓冲区全部文本（含 scrollback，去尾部空行）。
    // 以 base64（UTF-8）返回，纯 ASCII 字符集，避免 EvaluateJavaScriptAsync 的 JSON 转义干扰。
    window.__getTermText = function () {
        try {
            var buf = term.buffer.active;
            var lines = [];
            for (var y = 0; y < buf.length; y++) {
                var line = buf.getLine(y);
                if (!line) continue;
                lines.push(line.translateToString(true));
            }
            while (lines.length && lines[lines.length - 1].trim() === '') lines.pop();
            var str = lines.join('\n');
            var bytes = new TextEncoder().encode(str);
            var bin = '';
            for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
            return btoa(bin);
        } catch (e) { return ''; }
    };

    connect();
})();
</script>
</body>
</html>
